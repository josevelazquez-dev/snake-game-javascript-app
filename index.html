<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a2332" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serpiente" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Serpiente — Inicio</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #3ecf8e;
      --accent-dim: #2a9d6a;
      --food: #e85d75;
      --text: #e8eaed;
      --muted: #8b9cb3;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2838 0%, var(--bg) 55%);
      color: var(--text);
      padding: calc(3.5rem + var(--safe-t)) 1rem calc(1rem + var(--safe-b));
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .nav-top {
      position: fixed;
      top: calc(0.75rem + var(--safe-t));
      right: calc(0.75rem + var(--safe-r));
      display: flex;
      gap: 0.3rem;
      z-index: 10;
      background: rgba(15, 20, 25, 0.75);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      padding: 0.3rem 0.5rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .nav-top a {
      color: var(--accent);
      text-decoration: none;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      font-weight: 600;
      padding: 0.15rem 0.35rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .nav-top a:hover { text-decoration: underline; }
    .nav-top a[aria-current="page"] {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      cursor: default;
    }

    .hero {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 360px;
    }
    .hero h1 {
      font-weight: 600;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      letter-spacing: 0.04em;
      margin: 0 0 0.5rem;
      color: var(--muted);
    }
    .hero p {
      color: var(--muted);
      font-size: clamp(0.8rem, 2.8vw, 0.95rem);
      max-width: 300px;
      line-height: 1.6;
      margin: 0 auto;
      padding: 0 0.5rem;
    }
    .card-grid {
      display: grid;
      gap: 1rem;
      width: 100%;
      max-width: 360px;
    }
    .card-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid rgba(62, 207, 142, 0.15);
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, transform 0.15s;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }
    .card-link:active { transform: scale(0.98); }
    .card-link .icon {
      font-size: clamp(1.2rem, 5vw, 1.5rem);
      width: 40px;
      text-align: center;
      flex-shrink: 0;
    }
    .card-link .label {
      font-weight: 600;
      font-size: clamp(0.85rem, 3vw, 1rem);
    }
    .card-link .desc {
      font-size: clamp(0.7rem, 2.5vw, 0.8rem);
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .card-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .install-btn {
      appearance: none;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: clamp(0.85rem, 3vw, 1rem);
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      background: var(--accent);
      color: #0a0f12;
      width: 100%;
      max-width: 360px;
      margin-top: 1.5rem;
      transition: filter 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .install-btn:active { transform: scale(0.97); }
    .install-btn[hidden] { display: none; }
    .footer-text {
      margin-top: 2rem;
      font-size: clamp(0.65rem, 2.2vw, 0.75rem);
      color: var(--muted);
      opacity: 0.6;
    }

    @media (max-width: 360px) {
      body { padding-left: 0.6rem; padding-right: 0.6rem; }
      .card-grid { gap: 0.7rem; }
      .card-link { padding: 0.7rem 0.8rem; gap: 0.6rem; }
      .install-btn { padding: 0.6rem 1rem; }
      .nav-top { gap: 0.15rem; padding: 0.2rem 0.35rem; }
      .nav-top a { font-size: 0.65rem; padding: 0.1rem 0.25rem; }
    }

    @media (min-width: 768px) {
      .card-grid { max-width: 400px; }
      .hero { margin-bottom: 2.5rem; }
    }
  </style>
</head>
<body>
  <nav class="nav-top" aria-label="Principal">
    <a href="index.html" aria-current="page">Inicio</a>
    <span aria-hidden="true">·</span>
    <a href="snake.html">Juego</a>
    <span aria-hidden="true">·</span>
    <a href="ranking.html">Ranking</a>
    <span aria-hidden="true">·</span>
    <a href="estadisticas.html">Estadísticas</a>
  </nav>

  <div class="hero">
    <h1>Serpiente</h1>
    <p>El clásico juego de la serpiente. Controles táctiles y por teclado.</p>
  </div>

  <div class="card-grid">
    <a class="card-link" href="snake.html">
      <span class="icon">🐍</span>
      <div>
        <div class="label">Jugar ahora</div>
        <div class="desc">Inicia una partida</div>
      </div>
    </a>
    <a class="card-link" href="ranking.html">
      <span class="icon">🏆</span>
      <div>
        <div class="label">Ranking</div>
        <div class="desc">Mejores puntuaciones</div>
      </div>
    </a>
    <a class="card-link" href="estadisticas.html">
      <span class="icon">📊</span>
      <div>
        <div class="label">Estadísticas</div>
        <div class="desc">Historial de partidas</div>
      </div>
    </a>
  </div>

  <button type="button" id="installBtn" class="install-btn" hidden>
    Instalar aplicación
  </button>

  <p class="footer-text">Snake Game · PWA</p>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
    let installPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installPrompt = e;
      document.getElementById("installBtn").hidden = false;
    });
    document.getElementById("installBtn").addEventListener("click", () => {
      if (installPrompt) {
        installPrompt.prompt();
        installPrompt.userChoice.then(() => { installPrompt = null; });
      }
    });
    window.addEventListener("appinstalled", () => {
      document.getElementById("installBtn").hidden = true;
    });
  </script>
</body>
</html>
