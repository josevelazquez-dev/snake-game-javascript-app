<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serpiente — Inicio</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #3ecf8e;
      --accent-dim: #2a9d6a;
      --food: #e85d75;
      --text: #e8eaed;
      --muted: #8b9cb3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2838 0%, var(--bg) 55%);
      color: var(--text);
      padding: 1rem;
    }

    h1 {
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      margin: 0 0 0.75rem;
      color: var(--muted);
    }

    .snake-page-btn {
      display: inline-block;
      margin: 0 0 1rem;
      padding: 0.5rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid rgba(62, 207, 142, 0.45);
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.12s ease, filter 0.12s ease;
    }

    .snake-page-btn:hover {
      background: rgba(62, 207, 142, 0.12);
      filter: brightness(1.05);
    }

    .hud {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .hud span {
      color: var(--accent);
      font-weight: 600;
    }

    .frame {
      position: relative;
      padding: 4px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-dim), #1e3a5f);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    #game {
      display: block;
      border-radius: 8px;
      background: var(--panel);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .overlay {
      position: absolute;
      inset: 4px;
      border-radius: 8px;
      background: rgba(15, 20, 25, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay h2 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
    }

    .overlay p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 260px;
      line-height: 1.5;
    }

    button {
      appearance: none;
      border: none;
      padding: 0.65rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: #0a0f12;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    kbd {
      display: inline-block;
      padding: 0.15em 0.45em;
      border-radius: 4px;
      background: var(--panel);
      border: 1px solid #334155;
      font-family: inherit;
      font-size: 0.85em;
    }

    .nav-top {
      position: fixed;
      top: 1rem;
      right: 1rem;
    }

    .nav-top a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .nav-top a:hover {
      text-decoration: underline;
    }

    .nav-top a[aria-current="page"] {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      cursor: default;
    }
  </style>
</head>
<body>
  <nav class="nav-top" aria-label="Principal">
    <a href="snake.html">Juego</a>
    <span aria-hidden="true"> · </span>
    <a href="ranking.html">Ranking</a>
    <span aria-hidden="true"> · </span>
    <a href="estadisticas.html">Estadísticas</a>
  </nav>
  <h1>Serpiente</h1>
  <a class="snake-page-btn" href="snake.html">Abrir el juego en snake.html</a>
  <div class="hud">
    <div>Puntos: <span id="score">0</span></div>
    <div>Récord: <span id="best">0</span></div>
  </div>
  <div class="frame">
    <canvas id="game" width="400" height="400" aria-label="Tablero del juego"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">Serpiente</h2>
      <p id="overlayText">Usa las flechas del teclado para moverte. Come los puntos rojos para crecer.</p>
      <button type="button" id="startBtn">Jugar</button>
    </div>
  </div>
  <p class="hint">Controles: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> · Pausa: <kbd>Espacio</kbd></p>

  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");

      const GRID = 20;
      const CELL = canvas.width / GRID;
      const BEST_KEY = "snake-best";
      const MATCHES_KEY = "snake-matches";
      const MAX_STORED_MATCHES = 500;

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let tickMs;
      let loopId;
      let lastTick;
      let running;
      let paused;
      let gameStartedAt = 0;

      function recordMatch() {
        let arr = [];
        try {
          const raw = localStorage.getItem(MATCHES_KEY);
          const p = raw ? JSON.parse(raw) : [];
          arr = Array.isArray(p) ? p : [];
        } catch {
          arr = [];
        }
        const endedAt = Date.now();
        arr.push({
          at: endedAt,
          score,
          durationMs: Math.max(0, endedAt - gameStartedAt),
          length: snake.length,
        });
        if (arr.length > MAX_STORED_MATCHES) {
          arr = arr.slice(-MAX_STORED_MATCHES);
        }
        localStorage.setItem(MATCHES_KEY, JSON.stringify(arr));
      }

      function loadBest() {
        const n = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
        bestEl.textContent = String(Number.isFinite(n) ? n : 0);
      }

      function saveBest() {
        const b = parseInt(bestEl.textContent, 10) || 0;
        if (score > b) {
          localStorage.setItem(BEST_KEY, String(score));
          bestEl.textContent = String(score);
        }
      }

      function randomCell() {
        return {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      }

      function spawnFood() {
        let p;
        let safe = 0;
        do {
          p = randomCell();
          safe++;
        } while (
          safe < 500 &&
          snake.some((s) => s.x === p.x && s.y === p.y)
        );
        return p;
      }

      function resetGame() {
        const mid = Math.floor(GRID / 2);
        snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { ...dir };
        food = spawnFood();
        score = 0;
        tickMs = 140;
        scoreEl.textContent = "0";
        lastTick = 0;
        running = true;
        paused = false;
      }

      function drawCell(x, y, color) {
        const pad = 1;
        ctx.fillStyle = color;
        ctx.fillRect(
          x * CELL + pad,
          y * CELL + pad,
          CELL - pad * 2,
          CELL - pad * 2
        );
      }

      function draw() {
        ctx.fillStyle = "#1a2332";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        snake.forEach((seg, i) => {
          const t = i / Math.max(snake.length - 1, 1);
          const g = Math.floor(62 + t * 40);
          const b = Math.floor(142 + t * 50);
          drawCell(seg.x, seg.y, i === 0 ? "#3ecf8e" : `rgb(46, ${g}, ${b})`);
        });

        drawCell(food.x, food.y, "#e85d75");

        if (paused && running) {
          ctx.fillStyle = "rgba(15, 20, 25, 0.55)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#e8eaed";
          ctx.font = "600 18px Segoe UI, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Pausa", canvas.width / 2, canvas.height / 2);
        }
      }

      function step() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (
          head.x < 0 ||
          head.x >= GRID ||
          head.y < 0 ||
          head.y >= GRID ||
          snake.some((s) => s.x === head.x && s.y === head.y)
        ) {
          gameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = String(score);
          food = spawnFood();
          tickMs = Math.max(70, tickMs - 3);
        } else {
          snake.pop();
        }
      }

      function gameOver() {
        running = false;
        saveBest();
        recordMatch();
        cancelAnimationFrame(loopId);
        overlayTitle.textContent = "Fin del juego";
        overlayText.textContent = `Puntuación: ${score}. Pulsa Jugar de nuevo.`;
        startBtn.textContent = "Jugar de nuevo";
        overlay.hidden = false;
      }

      function loop(ts) {
        if (!running) return;
        if (paused) {
          draw();
          loopId = requestAnimationFrame(loop);
          return;
        }
        if (ts - lastTick >= tickMs) {
          lastTick = ts;
          step();
        }
        draw();
        loopId = requestAnimationFrame(loop);
      }

      function hideOverlayAndRun() {
        overlay.hidden = true;
        resetGame();
        gameStartedAt = Date.now();
        lastTick = performance.now();
        loopId = requestAnimationFrame(loop);
      }

      function togglePause() {
        if (!running || !overlay.hidden) return;
        paused = !paused;
      }

      startBtn.addEventListener("click", hideOverlayAndRun);

      window.addEventListener("keydown", (e) => {
        const key = e.key;
        if (key === " ") {
          e.preventDefault();
          togglePause();
          return;
        }
        let nx = nextDir.x;
        let ny = nextDir.y;
        if (key === "ArrowUp" && dir.y !== 1) {
          nx = 0;
          ny = -1;
        } else if (key === "ArrowDown" && dir.y !== -1) {
          nx = 0;
          ny = 1;
        } else if (key === "ArrowLeft" && dir.x !== 1) {
          nx = -1;
          ny = 0;
        } else if (key === "ArrowRight" && dir.x !== -1) {
          nx = 1;
          ny = 0;
        } else {
          return;
        }
        e.preventDefault();
        nextDir = { x: nx, y: ny };
      });

      loadBest();
      draw();
    })();
  </script>
</body>
</html>
