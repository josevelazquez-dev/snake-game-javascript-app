<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a2332" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serpiente" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Serpiente</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #3ecf8e;
      --accent-dim: #2a9d6a;
      --food: #e85d75;
      --text: #e8eaed;
      --muted: #8b9cb3;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2838 0%, var(--bg) 55%);
      color: var(--text);
      padding: calc(2.5rem + var(--safe-t)) 0.75rem calc(0.5rem + var(--safe-b));
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: none;
      overflow-x: hidden;
    }

    .nav-top {
      position: fixed;
      top: calc(0.5rem + var(--safe-t));
      right: calc(0.5rem + var(--safe-r));
      display: flex;
      gap: 0.3rem;
      z-index: 10;
      background: rgba(15, 20, 25, 0.75);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      padding: 0.3rem 0.5rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-top a {
      color: var(--accent);
      text-decoration: none;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      font-weight: 600;
      padding: 0.15rem 0.35rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .nav-top a:hover {
      text-decoration: underline;
    }

    .nav-top a[aria-current="page"] {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      cursor: default;
    }

    h1 {
      font-weight: 600;
      font-size: clamp(1rem, 4vw, 1.4rem);
      letter-spacing: 0.04em;
      margin: 0 0 0.4rem;
      color: var(--muted);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hud {
      display: flex;
      gap: clamp(0.8rem, 4vw, 1.5rem);
      margin-bottom: 0.4rem;
      font-variant-numeric: tabular-nums;
      font-size: clamp(0.8rem, 2.8vw, 0.95rem);
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    .hud span {
      color: var(--accent);
      font-weight: 600;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      flex: 1 0 auto;
      justify-content: flex-start;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .frame {
      position: relative;
      padding: 4px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-dim), #1e3a5f);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      width: min(400px, calc(100vw - 1.5rem));
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: var(--panel);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 4px;
      border-radius: 8px;
      background: rgba(15, 20, 25, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 1rem;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay h2 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
    }

    .overlay p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: clamp(0.8rem, 2.8vw, 0.95rem);
      max-width: 260px;
      line-height: 1.5;
      padding: 0 0.5rem;
    }

    button {
      appearance: none;
      border: none;
      padding: 0.65rem 1.4rem;
      font-size: clamp(0.85rem, 3vw, 1rem);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: #0a0f12;
      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.97); }

    .dpad {
      display: grid;
      grid-template-areas:
        ".    up    ."
        "left .     right"
        ".    down  .";
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: min(200px, 60vw);
      margin-top: 0.75rem;
      flex-shrink: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .dpad-btn {
      appearance: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(26, 35, 50, 0.85);
      border: 1px solid rgba(62, 207, 142, 0.25);
      color: var(--accent);
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      cursor: pointer;
      min-width: 48px;
      min-height: 48px;
      transition: background 0.08s, transform 0.06s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .dpad-btn:active {
      background: rgba(62, 207, 142, 0.2);
      transform: scale(0.93);
    }

    .dpad-btn[data-active="true"] {
      background: rgba(62, 207, 142, 0.25);
    }

    .dpad-up    { grid-area: up; }
    .dpad-down  { grid-area: down; }
    .dpad-left  { grid-area: left; }
    .dpad-right { grid-area: right; }

    .hint {
      margin-top: 0.5rem;
      font-size: clamp(0.65rem, 2.2vw, 0.8rem);
      color: var(--muted);
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    kbd {
      display: inline-block;
      padding: 0.15em 0.45em;
      border-radius: 4px;
      background: var(--panel);
      border: 1px solid #334155;
      font-family: inherit;
      font-size: 0.85em;
    }

    @media (max-height: 750px) {
      body {
        padding-top: calc(2rem + var(--safe-t));
        padding-bottom: calc(0.25rem + var(--safe-b));
      }
      h1 { margin-bottom: 0.2rem; }
      .hud { margin-bottom: 0.25rem; gap: 1rem; }
      .dpad {
        margin-top: 0.4rem;
        width: min(160px, 55vw);
        gap: 4px;
      }
      .dpad-btn {
        min-width: 40px;
        min-height: 40px;
        font-size: clamp(1rem, 4vw, 1.3rem);
      }
      .hint { margin-top: 0.25rem; }
    }

    @media (max-height: 600px) {
      h1 { display: none; }
      .hint { display: none; }
    }

    @media (max-width: 360px) {
      body {
        padding-left: 0.4rem;
        padding-right: 0.4rem;
        padding-top: calc(1.8rem + var(--safe-t));
      }
      .frame {
        width: min(400px, calc(100vw - 0.8rem));
      }
      .dpad {
        width: min(140px, 50vw);
        gap: 4px;
      }
      .dpad-btn {
        min-width: 36px;
        min-height: 36px;
        font-size: clamp(0.9rem, 4vw, 1.2rem);
      }
      .nav-top {
        gap: 0.15rem;
        padding: 0.2rem 0.35rem;
      }
      .nav-top a {
        font-size: 0.6rem;
        padding: 0.1rem 0.2rem;
      }
    }

    @media (min-width: 768px) {
      .game-area {
        max-width: 480px;
      }
      .dpad {
        width: 220px;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      h1 { display: none; }
      .hint { display: none; }
      body {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.5rem 1rem;
        padding: calc(0.5rem + var(--safe-t)) 0.75rem calc(0.5rem + var(--safe-b));
      }
      .nav-top {
        position: fixed;
        top: calc(0.25rem + var(--safe-t));
        right: calc(0.25rem + var(--safe-r));
        padding: 0.2rem 0.35rem;
      }
      .nav-top a { font-size: 0.6rem; }
      .game-area {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        max-width: 100%;
        flex: 0 1 auto;
      }
      .hud {
        position: fixed;
        top: calc(0.25rem + var(--safe-t));
        left: calc(0.5rem + var(--safe-l));
        margin: 0;
        font-size: 0.7rem;
        gap: 0.6rem;
        background: rgba(15, 20, 25, 0.65);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        padding: 0.2rem 0.5rem;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        z-index: 10;
      }
      .frame {
        width: min(240px, 45vh, calc(100vw - 180px));
        aspect-ratio: 1;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      }
      .dpad {
        margin-top: 0;
        width: min(130px, 28vh);
        gap: 4px;
      }
      .dpad-btn {
        min-width: 36px;
        min-height: 36px;
        font-size: clamp(0.9rem, 3vh, 1.3rem);
      }
    }
  </style>
</head>
<body>
  <nav class="nav-top" aria-label="Principal">
    <a href="index.html">Inicio</a>
    <span aria-hidden="true">·</span>
    <a href="snake.html" aria-current="page">Juego</a>
    <span aria-hidden="true">·</span>
    <a href="ranking.html">Ranking</a>
    <span aria-hidden="true">·</span>
    <a href="estadisticas.html">Estadísticas</a>
  </nav>
  <h1>Serpiente</h1>
  <div class="hud">
    <div>Puntos: <span id="score">0</span></div>
    <div>Récord: <span id="best">0</span></div>
  </div>
  <div class="game-area">
    <div class="frame">
      <canvas id="game" width="400" height="400" aria-label="Tablero del juego"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Serpiente</h2>
        <p id="overlayText">Usa las flechas del teclado o los botones táctiles para moverte. Come los puntos rojos para crecer.</p>
        <button type="button" id="startBtn">Jugar</button>
      </div>
    </div>

    <div class="dpad" role="group" aria-label="Controles táctiles">
      <button class="dpad-btn dpad-up"    data-dir="up"    aria-label="Arriba"    type="button">↑</button>
      <button class="dpad-btn dpad-left"  data-dir="left"  aria-label="Izquierda" type="button">←</button>
      <button class="dpad-btn dpad-down"  data-dir="down"  aria-label="Abajo"     type="button">↓</button>
      <button class="dpad-btn dpad-right" data-dir="right" aria-label="Derecha"   type="button">→</button>
    </div>
  </div>
  <p class="hint">
    Controles: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ·
    Pausa: <kbd>Espacio</kbd>
  </p>

  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const dpadBtns = document.querySelectorAll(".dpad-btn");

      const GRID = 20;
      const CELL = canvas.width / GRID;
      const BEST_KEY = "snake-best";
      const MATCHES_KEY = "snake-matches";
      const MAX_STORED_MATCHES = 500;

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let tickMs;
      let loopId;
      let lastTick;
      let running;
      let paused;
      let gameStartedAt = 0;

      const dirMap = {
        up:    { x: 0,  y: -1 },
        down:  { x: 0,  y: 1  },
        left:  { x: -1, y: 0  },
        right: { x: 1,  y: 0  }
      };

      function setDirection(dx, dy) {
        if (!running || !overlay.hidden) return;
        if (dir.x + dx === 0 && dir.y + dy === 0) return;
        nextDir = { x: dx, y: dy };
      }

      function recordMatch() {
        let arr = [];
        try {
          const raw = localStorage.getItem(MATCHES_KEY);
          const p = raw ? JSON.parse(raw) : [];
          arr = Array.isArray(p) ? p : [];
        } catch { arr = []; }
        const endedAt = Date.now();
        arr.push({
          at: endedAt,
          score,
          durationMs: Math.max(0, endedAt - gameStartedAt),
          length: snake.length,
        });
        if (arr.length > MAX_STORED_MATCHES) {
          arr = arr.slice(-MAX_STORED_MATCHES);
        }
        localStorage.setItem(MATCHES_KEY, JSON.stringify(arr));
      }

      function loadBest() {
        const n = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
        bestEl.textContent = String(Number.isFinite(n) ? n : 0);
      }

      function saveBest() {
        const b = parseInt(bestEl.textContent, 10) || 0;
        if (score > b) {
          localStorage.setItem(BEST_KEY, String(score));
          bestEl.textContent = String(score);
        }
      }

      function randomCell() {
        return {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      }

      function spawnFood() {
        let p;
        let safe = 0;
        do {
          p = randomCell();
          safe++;
        } while (safe < 500 && snake.some((s) => s.x === p.x && s.y === p.y));
        return p;
      }

      function resetGame() {
        const mid = Math.floor(GRID / 2);
        snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { ...dir };
        food = spawnFood();
        score = 0;
        tickMs = 140;
        scoreEl.textContent = "0";
        lastTick = 0;
        running = true;
        paused = false;
      }

      function drawCell(x, y, color) {
        const pad = 1;
        ctx.fillStyle = color;
        ctx.fillRect(
          x * CELL + pad,
          y * CELL + pad,
          CELL - pad * 2,
          CELL - pad * 2
        );
      }

      function draw() {
        ctx.fillStyle = "#1a2332";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        snake.forEach((seg, i) => {
          const t = i / Math.max(snake.length - 1, 1);
          const g = Math.floor(62 + t * 40);
          const b = Math.floor(142 + t * 50);
          drawCell(seg.x, seg.y, i === 0 ? "#3ecf8e" : `rgb(46, ${g}, ${b})`);
        });

        drawCell(food.x, food.y, "#e85d75");

        if (paused && running) {
          ctx.fillStyle = "rgba(15, 20, 25, 0.55)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#e8eaed";
          ctx.font = "600 18px Segoe UI, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Pausa", canvas.width / 2, canvas.height / 2);
        }
      }

      function step() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (
          head.x < 0 ||
          head.x >= GRID ||
          head.y < 0 ||
          head.y >= GRID ||
          snake.some((s) => s.x === head.x && s.y === head.y)
        ) {
          gameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = String(score);
          food = spawnFood();
          tickMs = Math.max(70, tickMs - 3);
        } else {
          snake.pop();
        }
      }

      function gameOver() {
        running = false;
        saveBest();
        recordMatch();
        cancelAnimationFrame(loopId);
        overlayTitle.textContent = "Fin del juego";
        overlayText.textContent = `Puntuación: ${score}. Pulsa Jugar de nuevo.`;
        startBtn.textContent = "Jugar de nuevo";
        overlay.hidden = false;
      }

      function loop(ts) {
        if (!running) return;
        if (paused) {
          draw();
          loopId = requestAnimationFrame(loop);
          return;
        }
        if (ts - lastTick >= tickMs) {
          lastTick = ts;
          step();
        }
        draw();
        loopId = requestAnimationFrame(loop);
      }

      function hideOverlayAndRun() {
        overlay.hidden = true;
        resetGame();
        gameStartedAt = Date.now();
        lastTick = performance.now();
        loopId = requestAnimationFrame(loop);
      }

      function togglePause() {
        if (!running || !overlay.hidden) return;
        paused = !paused;
      }

      startBtn.addEventListener("click", hideOverlayAndRun);

      window.addEventListener("keydown", (e) => {
        const key = e.key;
        if (key === " ") {
          e.preventDefault();
          togglePause();
          return;
        }
        let nx = nextDir.x;
        let ny = nextDir.y;
        if (key === "ArrowUp" && dir.y !== 1) {
          nx = 0; ny = -1;
        } else if (key === "ArrowDown" && dir.y !== -1) {
          nx = 0; ny = 1;
        } else if (key === "ArrowLeft" && dir.x !== 1) {
          nx = -1; ny = 0;
        } else if (key === "ArrowRight" && dir.x !== -1) {
          nx = 1; ny = 0;
        } else { return; }
        e.preventDefault();
        nextDir = { x: nx, y: ny };
      });

      dpadBtns.forEach((btn) => {
        const dirName = btn.getAttribute("data-dir");
        const d = dirMap[dirName];
        if (!d) return;

        function fire() {
          if (!running || !overlay.hidden) return;
          if (dir.x + d.x === 0 && dir.y + d.y === 0) return;
          nextDir = { x: d.x, y: d.y };
        }

        btn.addEventListener("touchstart", (e) => {
          e.preventDefault();
          btn.setAttribute("data-active", "true");
          fire();
        }, { passive: false });

        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          btn.setAttribute("data-active", "false");
        }, { passive: false });

        btn.addEventListener("touchcancel", () => {
          btn.setAttribute("data-active", "false");
        });

        btn.addEventListener("mousedown", (e) => {
          e.preventDefault();
          fire();
        });
      });

      let touchStartX = 0;
      let touchStartY = 0;
      let swiping = false;

      canvas.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        swiping = true;
      }, { passive: true });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("touchend", (e) => {
        if (!swiping) return;
        swiping = false;
        if (e.changedTouches.length !== 1) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);
        const minSwipe = 20;
        if (Math.max(absDx, absDy) < minSwipe) return;
        if (absDx > absDy) {
          setDirection(dx > 0 ? 1 : -1, 0);
        } else {
          setDirection(0, dy > 0 ? 1 : -1);
        }
      }, { passive: true });

      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("gesturechange", (e) => e.preventDefault());
      document.addEventListener("gestureend", (e) => e.preventDefault());

      document.addEventListener("contextmenu", (e) => {
        if (e.target.closest(".game-area, .dpad")) e.preventDefault();
      });

      loadBest();
      draw();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
